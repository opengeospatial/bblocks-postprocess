name: Validate and process Building Blocks
on:
  workflow_call:
    inputs:
      register_file:
        type: string
        description: JSON register file for output
        default: build/register.json
      items_dir:
        type: string
        description: Root directory where building blocks (subdirectories with bblock.json) are located
        default: _sources
      generated_docs_path:
        type: string
        description: Output directory for documentation
        default: build/generateddocs
      base_url:
        type: string
        description: Base URL to use for asset linkage
      fail_on_error:
        type: string
        description: Whether to fail on errors
        default: 'true'
      annotated_path:
        type: string
        description: Output path for annotated schemas
        default: build/annotated
      clean:
        type: string
        description: Whether to delete all output files and directories before generating new ones
        default: 'true'
      config_file:
        type: string
        description: Building blocks submodule config file
        default: 'bblocks-config.yaml'
      test_outputs_path:
        type: string
        description: Directory for test output resources
        default: build/tests
      github_base_url:
        type: string
        description: Base URL for linking to GitHub content
        default: https://github.com/${{github.repository}}/blob/${{github.ref_name}}/
      ref:
        type: string
        description: Repository ref for checkout
        default: ${{ github.ref_name }}
      skip-build:
        type: boolean
        description: Whether to skip the BB build part of the process
        default: false
      skip-pages:
        type: boolean
        description: Whether to skip the GH pages build part of the process
        default: false
      deploy_viewer:
        type: boolean
        description: Whether to use the new building blocks viewer
        default: true
      viewer_path:
        type: string
        description: Path where to deploy the viewer
        default: '.'
      viewer_show_imported:
        type: number
        description: |
          Level up to which the deployed building blocks viewer will show imported building
          blocks as well as local ones. 0 means "only local", and a negative number means
          "all imports".
          Deprecated: set viewer.show-imported-depth in bblocks-config.yaml instead.
          If that key is present, it takes precedence over this input.
        default: 0
      fallback_rainbow_instances:
        type: string
        description: |
          JSON array of Rainbow proxy URLs for linked data semantic lookups.
          Each URL should accept a ?uri= query parameter.
        default: '["https://defs.opengis.net/prez-backend/object","https://defs-hosted.opengis.net/prez-hosted-b/object"]'
      fallback_sparql_endpoints:
        type: string
        description: |
          JSON array of SPARQL endpoint URLs used as a fallback for linked data lookups.
        default: '[]'
      skip_permissions:
        type: string
        description: Skip interactive permission prompts for transforms and plugins
        default: 'true'
      enable_sparql:
        type: string
        description: Whether to push to the SPARQL Graph Store Protocol endpoint, if configured
        default: 'true'
      before_postprocess:
        type: string
        description: |
          Shell code to run before running the bblocks postprocessing (e.g., for setting up custom settings)
        default: ''
      before_pages:
        type: string
        description: |
          Shell code to run before pushing to GH pages (e.g., for cleanup)
        default: ''
      image_tag:
        type: string
        description: >-
          Docker tag of ghcr.io/opengeospatial/bblocks-postprocess to run. Leave empty (the
          default) to auto-resolve based on the ref this workflow is called at (see
          postprocess/action.yml). Set explicitly to override.
        default: ''
    secrets:
      sparql_username:
        description: SPARQL Graph Store Protocol user name for push authentication
        required: false
      sparql_password:
        description: SPARQL Graph Store Protocol password for push authentication
        required: false
      gh_pat:
        description: GitHub Personal Access Token to use when cloning repositories
        required: false


permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bblocks-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-process:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    outputs:
      sparql_config: ${{ steps.deploy-viewer.outputs.sparql_config }}
      register_url: ${{ steps.get-pages-url.outputs.result }}/${{ inputs.register_file }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ inputs.ref }}
      - name: Update submodules
        run: git submodule update --recursive --remote
      - name: Read deploy configuration
        id: deploy-config
        env:
          CONFIG_FILE: ${{ inputs.config_file }}
          SOURCE_REF: ${{ inputs.ref }}
        run: |
          # Same override semantics as the sparql config below: bblocks-config-override.yml
          # (deep-merged) wins over the main config file.
          OVERRIDE_FILE=""
          for f in bblocks-config-override.yml bblocks-config-override.yaml; do
            if [ -f "$f" ]; then
              OVERRIDE_FILE="$f"
              break
            fi
          done
          if [ ! -f "$CONFIG_FILE" ]; then
            DEPLOY_JSON='null'
          elif [ -n "$OVERRIDE_FILE" ]; then
            DEPLOY_JSON="$(yq eval-all -o=json 'select(fi==0) * select(fi==1) | .deploy' "$CONFIG_FILE" "$OVERRIDE_FILE")"
          else
            DEPLOY_JSON="$(yq -o=json '.deploy' "$CONFIG_FILE")"
          fi
          MODE="$(jq -r '.mode // "artifact"' <<< "${DEPLOY_JSON:-null}")"
          BRANCH="$(jq -r '.branch // "gh-pages"' <<< "${DEPLOY_JSON:-null}")"

          case "$MODE" in
            artifact|branch) ;;
            *)
              echo "::error::Invalid deploy.mode '$MODE' in bblocks-config.yaml (expected 'artifact' or 'branch')"
              exit 1
              ;;
          esac
          if [ "$MODE" = "branch" ]; then
            if ! git check-ref-format --branch "$BRANCH" > /dev/null; then
              echo "::error::Invalid deploy.branch '$BRANCH' in bblocks-config.yaml"
              exit 1
            fi
            if [ "$BRANCH" = "$SOURCE_REF" ]; then
              echo "::error::deploy.branch '$BRANCH' is the branch being built; the site would overwrite the sources"
              exit 1
            fi
          fi
          echo "Deploy mode: $MODE (branch: $BRANCH)"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
      - name: Get Pages Base URL
        id: get-pages-url
        uses: actions/github-script@v9
        env:
          DEPLOY_MODE: ${{ steps.deploy-config.outputs.mode }}
          DEPLOY_BRANCH: ${{ steps.deploy-config.outputs.branch }}
          SOURCE_REF: ${{ inputs.ref }}
        with:
          result-encoding: string
          script: |
            let base_url;
            let pages;
            if ("${{ inputs.base_url }}"?.trim()) {
              base_url = "${{ inputs.base_url }}";
            } else {
              const { owner, repo } = context.repo;
              try {
                const response = await github.rest.repos.getPages({
                  owner,
                  repo
                });
                base_url = response.data.html_url;
                pages = response.data;
              } catch {
                core.warning('No base_url provided, and the GitHub Pages URL could not be retrieved. Did you forget to enable GitHub Pages?');
                if (process.env.DEPLOY_MODE === 'branch') {
                  // The site only exists on the deploy branch, so the best guess is the default
                  // Pages URL (the Pages source is expected to be configured after the first run)
                  base_url = repo.toLowerCase() === `${owner}.github.io`.toLowerCase()
                    ? `https://${owner}.github.io`
                    : `https://${owner}.github.io/${repo}`;
                } else {
                  base_url = `https://raw.githubusercontent.com/${owner}/${repo}/${process.env.SOURCE_REF}`;
                }
              }
            }
            if (process.env.DEPLOY_MODE === 'branch') {
              // Guard against publishing to a branch that GitHub Pages is not serving
              const branch = process.env.DEPLOY_BRANCH;
              const { owner, repo } = context.repo;
              let branchExists = true;
              try {
                await github.rest.repos.getBranch({ owner, repo, branch });
              } catch (e) {
                if (e.status !== 404) {
                  throw e;
                }
                branchExists = false;
              }
              const pagesHint = `Set the Pages source to "Deploy from a branch" (${branch}, "/ (root)")`;
              if (!branchExists) {
                // Pages can only be pointed at an existing branch, and this run creates it
                core.warning(`Branch "${branch}" does not exist yet: it will be created by this run. ${pagesHint} afterwards to serve it.`);
              } else if (!pages) {
                core.warning(`deploy.mode is "branch", but the GitHub Pages configuration could not be read. ${pagesHint}.`);
              } else if (pages.build_type !== 'legacy') {
                core.setFailed(`deploy.mode is "branch", but GitHub Pages is set to deploy from "${pages.build_type === 'workflow' ? 'GitHub Actions' : pages.build_type}". ${pagesHint}, or set deploy.mode to "artifact".`);
              } else if (pages.source?.branch !== branch || (pages.source?.path ?? '/') !== '/') {
                core.setFailed(`deploy.mode is "branch" with deploy.branch "${branch}", but GitHub Pages is serving "${pages.source?.branch}" from "${pages.source?.path}". ${pagesHint}, or update deploy.branch.`);
              }
            }
            // Remove trailing slash
            const parsed = new URL(base_url);
            base_url = base_url.replace(/\/$/, '');
            core.exportVariable('PAGES_BASE_URL', base_url);
            core.exportVariable('PAGES_PATH', parsed.pathname);
            return base_url;
      - name: Process GitHub repository mappings
        id: repo-mappings
        run: |
          export RANDOM_DIR="_repos_$(openssl rand -hex 8)"
          mkdir "$RANDOM_DIR"
          echo '*' > "${RANDOM_DIR}/.gitignore" 
          
          if [ -f "bblocks-github.yaml" ]; then
            INPUT_YML="bblocks-github.yaml"
          elif [ -f "bblocks-github.yml" ]; then
            INPUT_YML="bblocks-github.yml"
          fi
          
          if [ -z "$INPUT_YML" ]; then
            echo "No GitHub repository mappings found"
            exit 0
          fi
          
          MAPPINGS_YML="bblocks-config-local.yml"
          echo 'url-mappings:' > $MAPPINGS_YML
          echo "generated_local_config=true" >> "$GITHUB_OUTPUT"
          
          if [ -z "${{ secrets.GH_PAT }}" ]; then
            GH_AUTH=
            echo "*WARNING* Cloning repository without a PAT"
          else
            GH_AUTH="x-access-token:${{ secrets.GH_PAT }}@"
            echo "Using a GitHub PAT"
          fi
          export GH_AUTH
          yq -r '."repository-mappings" | to_entries[] |
            "\(strenv(RANDOM_DIR))/\(.value | sub(\"[^A-Za-z0-9]\", \"_\"))" as $SUBDIR |
            "
            if [ ! -d \"\($SUBDIR)\" ]; then
              git clone \"https://\(strenv(GH_AUTH))github.com/\(.value).git\" \"\($SUBDIR)\"
            fi
            echo \"  \\\"\(.key)\\\": \\\"\($SUBDIR)\\\"\" >> bblocks-config-local.yml
            "
          ' < $INPUT_YML > _script.sh
          cat _script.sh
          bash _script.sh
          
          
          echo "Repositories cloned and mapped in $RANDOM_DIR — output saved to $MAPPINGS_YML"

      - name: Restore bblocks sandbox cache
        uses: actions/cache/restore@v6
        with:
          path: .bblocks-sandbox
          key: bblocks-sandbox-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            bblocks-sandbox-${{ runner.os }}-
      - name: Before postprocess
        if: ${{inputs.before_postprocess}}
        run: ${{inputs.before_postprocess}}
      - name: OGC BB postprocess
        if: ${{ !inputs.skip-build }}
        uses: opengeospatial/bblocks-postprocess/full@v1
        with:
          register_file: ${{ inputs.register_file }}
          items_dir: ${{ inputs.items_dir }}
          generated_docs_path: ${{ inputs.generated_docs_path }}
          base_url: ${{ steps.get-pages-url.outputs.result }}
          fail_on_error: ${{ inputs.fail_on_error }}
          annotated_path: ${{ inputs.annotated_path }}
          clean: ${{ inputs.clean }}
          config_file: ${{ inputs.config_file }}
          test_outputs_path: ${{ inputs.test_outputs_path }}
          github_base_url: ${{ inputs.github_base_url }}
          deploy_viewer: ${{ inputs.deploy_viewer && 'true' || 'false' }}
          viewer_path: ${{ inputs.viewer_path }}
          skip_permissions: ${{ inputs.skip_permissions }}
          enable_sparql: ${{ inputs.enable_sparql }}
          sparql_username: ${{ secrets.sparql_username }}
          sparql_password: ${{ secrets.sparql_password }}
          image_tag: ${{ inputs.image_tag }}
      - name: Fix permissions, compress large _visited_properties.tsv, git pull
        run: |
          sudo chown -R $UID:$(id -g) . || true
          sudo find "${{ inputs.annotated_path }}" -size +10M -name _visited_properties.tsv \
            -exec gzip \{\} \; || true
          git pull
      - name: Add & Commit
        if: ${{ !endsWith(github.repository, '/bblocks-template') && !inputs.skip-build && steps.deploy-config.outputs.mode != 'branch' }}
        uses: EndBug/add-and-commit@v10
        with:
          message: Building blocks postprocessing
      - name: Save bblocks sandbox cache
        if: ${{ !inputs.skip-build }}
        uses: actions/cache/save@v6
        with:
          path: .bblocks-sandbox
          key: bblocks-sandbox-${{ runner.os }}-${{ github.run_id }}
      - name: Remove build artifacts from pages
        run: |
          sudo find "${{ inputs.annotated_path }}" -name _visited_properties.tsv -delete || true
          sudo find "${{ inputs.annotated_path }}" -name _visited_properties.tsv.gz -delete || true
          rm -rf .bblocks-sandbox
          # Remove LLM tool configuration files
          rm -rf .claude CLAUDE.md AGENTS.md GEMINI.md .cursor .cursorrules .windsurfrules .ruler .continue
          find . -maxdepth 1 -name '.aider*' -exec rm -rf {} + || true
      - name: Deploy Building Blocks viewer
        id: deploy-viewer
        if: ${{ inputs.deploy_viewer }}
        run: |
          OLD_WD="$(pwd)"
          REGISTER_FILE="$(realpath "${{ inputs.register_file }}")"
          if [ -n "${{ inputs.viewer_path }}" ]; then
            mkdir -p "${{ inputs.viewer_path }}"
            cd "${{ inputs.viewer_path }}"
          fi
          
          # If viewer path is '.' or './', clear it.
          # Otherwise, remove any leading './'
          BASE_URL="${{ inputs.viewer_path }}"
          if [[ "${BASE_URL}" =~ ^\./?$ ]]; then
            BASE_URL=
          else
            BASE_URL=${BASE_URL#./}
          fi
          # Add trailing slash to BASE_URL if not empty
          if [[ "${BASE_URL}" =~ [^/]$ ]]; then
            BASE_URL="${BASE_URL}/"
          fi

          # Pull register name/description for the viewer shell's <title> and Open Graph
          # meta tags, so link preview cards (which don't execute the SPA's JS) show
          # something more specific than a generic hardcoded title.
          REG_NAME="$(jq -r '.name // "OGC Building Blocks"' < "$REGISTER_FILE")"
          REG_DESCRIPTION="$(jq -r '.abstract // .description // ""' < "$REGISTER_FILE")"
          html_escape() {
            sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e 's/"/\&quot;/g'
          }
          REG_NAME_HTML="$(printf '%s' "$REG_NAME" | html_escape)"
          REG_DESCRIPTION_HTML="$(printf '%s' "$REG_DESCRIPTION" | html_escape)"
          PAGE_URL="${{ steps.get-pages-url.outputs.result }}/${BASE_URL}"

          cat << EOF > index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <script>
              // Upgrade http:// subresources only when served over https; plain-http
              // viewers (e.g. local testing against http://localhost registers) are left alone.
              if (location.protocol === 'https:') {
                var csp = document.createElement('meta');
                csp.httpEquiv = 'Content-Security-Policy';
                csp.content = 'upgrade-insecure-requests';
                document.head.appendChild(csp);
              }
            </script>
            <link rel="icon" href="https://ogcincubator.github.io/bblocks-viewer/favicon.ico" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>${REG_NAME_HTML}</title>
            <meta name="description" content="${REG_DESCRIPTION_HTML}" />
            <meta property="og:type" content="website" />
            <meta property="og:title" content="${REG_NAME_HTML}" />
            <meta property="og:description" content="${REG_DESCRIPTION_HTML}" />
            <meta property="og:url" content="${PAGE_URL}" />
            <meta name="twitter:card" content="summary" />
            <meta name="twitter:title" content="${REG_NAME_HTML}" />
            <meta name="twitter:description" content="${REG_DESCRIPTION_HTML}" />
            <script src="${{ steps.get-pages-url.outputs.result }}/${BASE_URL}config.js"></script>
            <script type="module" crossorigin src="https://ogcincubator.github.io/bblocks-viewer/assets/index.js"></script>
            <link rel="stylesheet" href="https://ogcincubator.github.io/bblocks-viewer/assets/index.css">
          </head>
          <body>
            <div id="app"></div>
          </body>
          </html>
          EOF
          
          BBLOCKS_RAINBOW='${{ inputs.fallback_rainbow_instances }}'
          BBLOCKS_RAINBOW="${BBLOCKS_RAINBOW:-[]}"
          BBLOCKS_SPARQL='${{ inputs.fallback_sparql_endpoints }}'
          BBLOCKS_SPARQL="${BBLOCKS_SPARQL:-[]}"

          # Prefer viewer.show-imported-depth from bblocks-config.yaml if present
          SHOW_IMPORTED=$(yq '.viewer."show-imported-depth" // null' "${OLD_WD}/${{ inputs.config_file }}" 2>/dev/null)
          if [ "$SHOW_IMPORTED" = "null" ] || [ -z "$SHOW_IMPORTED" ]; then
            SHOW_IMPORTED='${{ inputs.viewer_show_imported }}'
          fi

          cat << EOF > config.js
          window.bblocksRegister = '${{ steps.get-pages-url.outputs.result }}/${{ inputs.register_file }}';
          window.bblocksViewer = {
            title: $(jq '.name // "${{ github.event.repository.name }}"' < "$REGISTER_FILE"),
            showImported: ${SHOW_IMPORTED},
            baseUrl: '${PAGES_PATH}${BASE_URL}',
            bblocksFallbackRainbowInstances: ${BBLOCKS_RAINBOW},
            bblocksFallbackSparqlEndpoints: ${BBLOCKS_SPARQL},
          };
          EOF
          
          if [ -f GIT_INFO ]; then
            TEMPFILE="$(mktemp)"
            jq -s '.[0].tooling."bblocks-viewer" = .[1] | .[0]' "$REGISTER_FILE" GIT_INFO > "$TEMPFILE"
            mv "$TEMPFILE" "$REGISTER_FILE"
            rm -f "$TEMPFILE"
          fi
          
          cd "$OLD_WD"
          
          if [ ! -f "404.html" ]; then
            cp "${{ inputs.viewer_path }}/index.html" 404.html
          fi
          
          # Apply bblocks-config-override.yml (if present) before reading .sparql, so a
          # downstream fork can disable the triplestore upload (e.g. `sparql: null` or
          # `sparql: false`) without editing the upstream bblocks-config.yaml.
          OVERRIDE_FILE=""
          for f in bblocks-config-override.yml bblocks-config-override.yaml; do
            if [ -f "$f" ]; then
              OVERRIDE_FILE="$f"
              break
            fi
          done

          {
            echo 'sparql_config<<eirue3biu8Cai6cioraaJie8theechi7ahgheiM0dojooho0unii2deech4abiaX'
            if [ -n "$OVERRIDE_FILE" ]; then
              yq eval-all -o=json 'select(fi==0) * select(fi==1) | .sparql' '${{ inputs.config_file }}' "$OVERRIDE_FILE"
            else
              yq -o=json '.sparql' '${{ inputs.config_file }}'
            fi
            echo 'eirue3biu8Cai6cioraaJie8theechi7ahgheiM0dojooho0unii2deech4abiaX'
          } >> "$GITHUB_OUTPUT"
          
      - name: Before pages
        if: ${{inputs.before_pages}}
        run: ${{inputs.before_pages}}
      - name: Setup Pages
        if: ${{ github.event.repository.has_pages && !inputs.skip-pages && steps.deploy-config.outputs.mode == 'artifact' }}
        uses: actions/configure-pages@v6
      - name: Upload artifacts
        if: ${{ github.event.repository.has_pages && !inputs.skip-pages && steps.deploy-config.outputs.mode == 'artifact' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy to GH Pages
        if: ${{ github.event.repository.has_pages && !inputs.skip-pages && steps.deploy-config.outputs.mode == 'artifact' }}
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Publish to branch
        if: ${{ !inputs.skip-pages && steps.deploy-config.outputs.mode == 'branch' }}
        env:
          PAGES_BRANCH: ${{ steps.deploy-config.outputs.branch }}
          GENERATED_LOCAL_CONFIG: ${{ steps.repo-mappings.outputs.generated_local_config }}
        run: |
          SITE_DIR="$(pwd)"
          PUBLISH_DIR="$(mktemp -d)"
          # A worktree of this checkout reuses its (token-bearing) git config for the push
          if git fetch origin "+refs/heads/${PAGES_BRANCH}:refs/remotes/origin/${PAGES_BRANCH}"; then
            git worktree add -B "$PAGES_BRANCH" "$PUBLISH_DIR" "origin/${PAGES_BRANCH}"
          else
            echo "Branch '${PAGES_BRANCH}' does not exist yet: creating it"
            git worktree add --detach "$PUBLISH_DIR"
            git -C "$PUBLISH_DIR" checkout --orphan "$PAGES_BRANCH"
            git -C "$PUBLISH_DIR" rm -rfq --ignore-unmatch .
          fi

          # Hidden files are left out (as upload-pages-artifact does), and so are the clones and
          # the generated script from the repository mappings step
          rsync -a --checksum --delete \
            --exclude='.*' --exclude='/_repos_*' --exclude='/_script.sh' \
            "$SITE_DIR/" "$PUBLISH_DIR/"
          # rsync leaves excluded paths alone in the destination, so also purge the generated
          # script if an earlier publish ever left it on the branch (it can embed the PAT)
          rm -f "$PUBLISH_DIR/_script.sh"
          # Same for the URL mappings generated for the cloned repositories (they point at
          # clones that aren't published); a bblocks-config-local.yml the repo ships stays
          if [ "$GENERATED_LOCAL_CONFIG" = "true" ]; then
            rm -f "$PUBLISH_DIR/bblocks-config-local.yml"
          fi
          # Branch deployments run Jekyll unless told otherwise, which would drop all
          # underscore-prefixed paths
          touch "$PUBLISH_DIR/.nojekyll"

          cd "$PUBLISH_DIR"
          git add -A
          if git diff --cached --quiet && git rev-parse -q --verify HEAD > /dev/null; then
            echo "No changes to publish"
          else
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -q -m "Building blocks postprocessing" -m "Source: ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
            git push origin "HEAD:refs/heads/${PAGES_BRANCH}"
          fi
      - name: Wait for Pages to serve the new register
        # Only needed by upload-to-triplestore, which fetches the published register.json
        if: ${{ github.event.repository.has_pages && !inputs.skip-pages && steps.deploy-config.outputs.mode == 'branch' && inputs.enable_sparql == 'true' && steps.deploy-viewer.outputs.sparql_config != 'null' && steps.deploy-viewer.outputs.sparql_config != 'false' }}
        env:
          REGISTER_URL: ${{ steps.get-pages-url.outputs.result }}/${{ inputs.register_file }}
          REGISTER_FILE: ${{ inputs.register_file }}
        run: |
          EXPECTED="$(sha256sum "$REGISTER_FILE" | cut -d' ' -f1)"
          for i in $(seq 1 40); do
            ACTUAL="$(curl -fsSL "${REGISTER_URL}?_=${RANDOM}" | sha256sum | cut -d' ' -f1 || true)"
            if [ "$ACTUAL" = "$EXPECTED" ]; then
              echo "Published register is up to date"
              exit 0
            fi
            echo "Waiting for ${REGISTER_URL} to be updated (attempt $i)..."
            sleep 15
          done
          echo "::error::Timed out waiting for GitHub Pages to serve the updated register"
          exit 1
  upload-to-triplestore:
    needs: validate-and-process
    if: ${{ github.event.repository.has_pages && !inputs.skip-pages && needs.validate-and-process.outputs.register_url }}
    uses: ./.github/workflows/upload-to-triplestore.yml
    with:
      sparql_config: ${{ needs.validate-and-process.outputs.sparql_config }}
      register_url: ${{ needs.validate-and-process.outputs.register_url }}
    secrets:
      sparql_username: ${{ secrets.sparql_username }}
      sparql_password: ${{ secrets.sparql_password }}
