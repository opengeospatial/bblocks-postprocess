name: Test action
on:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.repository.owner.login }}/bblocks-template
      - name: OGC BB postprocess
        uses: opengeospatial/bblocks-postprocess/full@master
      - name: Log resulting files
        run: |
          find -type f -not -path './.git/*' | sort
