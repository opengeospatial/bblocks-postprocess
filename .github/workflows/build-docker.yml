name: Build Docker image
on:
  workflow_dispatch:
  push:
    branches:
      - develop
    tags:
      - 'v1.*.*'

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/pytest.yml

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Add git environment variables
        id: env-variables
        run: |
          echo "BBP_GIT_INFO=\"$(git rev-parse HEAD) $(date --iso-8601=seconds)\"" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > ogc/bblocks/_VERSION

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/opengeospatial/bblocks-postprocess
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=master,enable=${{ startsWith(github.ref, 'refs/tags/v1.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v1.') }}
            type=raw,value=v1,enable=${{ startsWith(github.ref, 'refs/tags/v1.') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BBP_GIT_INFO=${{ steps.env-variables.outputs.BBP_GIT_INFO }}

      - name: Force-move v1 tag to this release
        if: startsWith(github.ref, 'refs/tags/v1.')
        run: |
          git tag -f v1
          git push origin v1 --force

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v1.')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Notes given to scripts/tag-release.sh live in the annotated tag's message
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          # (only annotated tags: for a lightweight one, %(contents) would be the commit message)
          : > "${RUNNER_TEMP}/release-notes.md"
          if [[ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" == "tag" ]]; then
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/release-notes.md"
          fi
          if [[ -s "${RUNNER_TEMP}/release-notes.md" ]]; then
            # Hand-written notes replace GitHub's auto-generated ones (which would add
            # "What's Changed"/"New Contributors" sections); only the compare link is kept
            git fetch --force --tags origin
            prev_tag=$(git tag --list 'v1.*.*' --sort=-v:refname | grep -x -A1 "${GITHUB_REF_NAME}" | tail -n +2 || true)
            if [[ -n "$prev_tag" ]]; then
              printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' \
                "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "$prev_tag" "${GITHUB_REF_NAME}" \
                >> "${RUNNER_TEMP}/release-notes.md"
            fi
            gh release create "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/release-notes.md"
          else
            gh release create "${GITHUB_REF_NAME}" --generate-notes
          fi
