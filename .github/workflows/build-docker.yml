name: Build Docker image
on:
  workflow_dispatch:
  push:
    branches:
      - develop
    tags:
      - 'v1.*.*'

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Add git environment variables
        id: env-variables
        run: |
          echo "BBP_GIT_INFO=\"$(git rev-parse HEAD) $(date --iso-8601=seconds)\"" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > ogc/bblocks/_VERSION

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/opengeospatial/bblocks-postprocess
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=master,enable=${{ startsWith(github.ref, 'refs/tags/v1.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v1.') }}
            type=raw,value=v1,enable=${{ startsWith(github.ref, 'refs/tags/v1.') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BBP_GIT_INFO=${{ steps.env-variables.outputs.BBP_GIT_INFO }}

      - name: Force-move v1 tag to this release
        if: startsWith(github.ref, 'refs/tags/v1.')
        run: |
          git tag -f v1
          git push origin v1 --force

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v1.')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} --generate-notes