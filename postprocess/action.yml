name: OGC Building Blocks postprocess
description: Generates documentation and output files for OGC building blocks
author: Alejandro Villar
inputs:
  register_file:
    description: JSON register file for output
    default: build/register.json
  items_dir:
    description: Root directory where building blocks (subdirectories with bblock.json) are located
    default: _sources
  generated_docs_path:
    description: Output directory for documentation
    default: build/generateddocs
  base_url:
    description: Base URL to use for asset linkage
    default: >-
      ${{ github.event.repository.has_pages
        && format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name)
        || format('https://raw.githubusercontent.com/{0}/{1}', github.repository, github.ref_name) }}
  fail_on_error:
    description: Whether to fail on errors
    default: 'false'
  annotated_path:
    description: Output path for annotated schemas
    default: build/annotated
  clean:
    description: Whether to delete all output files and directories before generating new ones
    default: 'true'
  config_file:
    description: Building blocks submodule config file
    default: 'bblocks-config.yaml'
  test_outputs_path:
    description: Directory for test output resources
    default: build/tests
  github_base_url:
    description: Base URL for linking to GitHub content
    default: https://github.com/${{github.repository}}/blob/${{github.ref_name}}/
  deploy_viewer:
    description: Whether to use the new building blocks viewer
    default: 'true'
  viewer_path:
    description: Path where to deploy the viewer
    default: '.'
  skip_permissions:
    description: Skip interactive permission prompts for transforms and plugins (set to true in CI)
    default: 'true'
  enable_sparql:
    description: Whether to push to the SPARQL Graph Store Protocol endpoint, if configured (set to false to skip pushing entirely, e.g. for PR checks)
    default: 'true'
  sparql_username:
    description: SPARQL GSP push user name
    default: ''
  sparql_password:
    description: SPARQL GSP push password
    default: ''
  image_tag:
    description: >-
      Docker tag of ghcr.io/opengeospatial/bblocks-postprocess to run (e.g. 'develop' to test
      pre-release changes). Defaults to the image's 'latest' tag, which only moves on a v1.*.*
      release.
    default: 'latest'

runs:
  using: composite
  steps:
    - name: Run OGC BB postprocess
      shell: bash
      env:
        BBP_IMAGE_TAG: ${{ inputs.image_tag }}
        BBP_REGISTER_FILE: ${{ inputs.register_file }}
        BBP_ITEMS_DIR: ${{ inputs.items_dir }}
        BBP_GENERATED_DOCS_PATH: ${{ inputs.generated_docs_path }}
        BBP_BASE_URL: ${{ inputs.base_url }}
        BBP_FAIL_ON_ERROR: ${{ inputs.fail_on_error }}
        BBP_ANNOTATED_PATH: ${{ inputs.annotated_path }}
        BBP_CLEAN: ${{ inputs.clean }}
        BBP_CONFIG_FILE: ${{ inputs.config_file }}
        BBP_TEST_OUTPUTS_PATH: ${{ inputs.test_outputs_path }}
        BBP_GITHUB_BASE_URL: ${{ inputs.github_base_url }}
        BBP_DEPLOY_VIEWER: ${{ inputs.deploy_viewer }}
        BBP_VIEWER_PATH: ${{ inputs.viewer_path }}
        BBP_SKIP_PERMISSIONS: ${{ inputs.skip_permissions }}
        BBP_ENABLE_SPARQL: ${{ inputs.enable_sparql }}
        SPARQL_USERNAME: ${{ inputs.sparql_username }}
        SPARQL_PASSWORD: ${{ inputs.sparql_password }}
      # Every input is passed through env vars (rather than interpolated directly into this
      # script) to avoid shell injection via GitHub Actions expression substitution.
      run: |
        docker run --rm --pull=always \
          -v "${{ github.workspace }}:/github/workspace" \
          --workdir /github/workspace \
          -e SPARQL_USERNAME -e SPARQL_PASSWORD \
          "ghcr.io/opengeospatial/bblocks-postprocess:${BBP_IMAGE_TAG}" \
          --register-file "${BBP_REGISTER_FILE}" \
          --items-dir "${BBP_ITEMS_DIR}" \
          --generated-docs-path "${BBP_GENERATED_DOCS_PATH}" \
          --base-url "${BBP_BASE_URL}" \
          --fail-on-error "${BBP_FAIL_ON_ERROR}" \
          --annotated-path "${BBP_ANNOTATED_PATH}" \
          --clean "${BBP_CLEAN}" \
          --config-file "${BBP_CONFIG_FILE}" \
          --test-outputs "${BBP_TEST_OUTPUTS_PATH}" \
          --github-base-url "${BBP_GITHUB_BASE_URL}" \
          --deploy-viewer "${BBP_DEPLOY_VIEWER}" \
          --viewer-path "${BBP_VIEWER_PATH}" \
          --skip-permissions "${BBP_SKIP_PERMISSIONS}" \
          --enable-sparql "${BBP_ENABLE_SPARQL}"
