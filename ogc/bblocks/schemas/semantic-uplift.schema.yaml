$schema: https://json-schema.org/draft/2020-12/schema
title: Additional configuration for semantic uplift of resources
type: object
properties:
  additionalSteps:
    description: List of additional transformation steps to perform before or after the actual semantic uplift
    type: array
    items:
      type: object
      properties:
        type:
          description: |
            Type of transformation step. The type will also determine whether the step will be run before or after
            the uplift
          enum:
            - jq
            - shacl
            - sparql-construct
            - sparql-update
        code:
          description: Code contents of this transformation step (e.g., jq script or SHACL rules file).
          type: string
          pattern: '[^\s]+'
        ref:
          description: |
            Location of a file with the code contents of this transformation ste (instead of
            providing them inline through the "code" property).
          type: string
          pattern: '[^\s]+'
        inheritable:
          description: |
            Whether this "post"-stage step (shacl, sparql-construct, sparql-update) should also be run
            automatically as part of the semantic uplift of a wrapping/profiling bblock (one that depends
            on or profiles this one), provided that bblock opts in via its own "inheritedPostSteps"
            property. Not valid on "pre"-stage steps (jq), since those operate on this bblock's own JSON
            document shape and would not meaningfully apply to a wrapping bblock's document.
          type: boolean
          default: false
      required:
        - type
      oneOf:
        - required:
          - code
        - required:
          - ref
      if:
        properties:
          type:
            const: jq
        required:
          - type
      then:
        not:
          required:
            - inheritable
  inheritedPostSteps:
    description: |
      Controls which "post"-stage semantic uplift steps marked "inheritable" by this bblock's own
      dependencies (transitively, via dependsOn/isProfileOf) are automatically run as part of this
      bblock's own semantic uplift, after those dependencies' steps have themselves run and before
      this bblock's own "post"-stage additionalSteps. Accepts true (inherit from every dependency that
      marks steps inheritable), false (inherit nothing - the default), or a list of bblock identifiers
      to inherit from (any others are ignored even if they mark steps inheritable).
    oneOf:
      - type: boolean
      - type: array
        items:
          type: string
    default: false
