[pytest]
testpaths = tests
python_files = test_*.py
filterwarnings =
    # Upstream: pyshacl imports the deprecated pkg_resources API, whose vendored
    # pyparsing still imports the deprecated stdlib sre_constants module. Not
    # something we can fix from this repo; narrowly scoped so other deprecation
    # warnings stay visible.
    ignore:module 'sre_constants' is deprecated:DeprecationWarning:pkg_resources
