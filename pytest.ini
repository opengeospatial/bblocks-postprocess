[pytest]
testpaths = tests
python_files = test_*.py
# Import by file path instead of bare module name: without this, two test files
# with the same basename under different subdirectories (e.g. tests/test_foo.py
# and tests/build_hooks/test_foo.py) collide, since neither tests/ nor its
# subdirectories carry an __init__.py to disambiguate them into packages.
addopts = --import-mode=importlib
filterwarnings =
    # Upstream: pyshacl imports the deprecated pkg_resources API, whose vendored
    # pyparsing still imports the deprecated stdlib sre_constants module. Not
    # something we can fix from this repo; narrowly scoped so other deprecation
    # warnings stay visible.
    ignore:module 'sre_constants' is deprecated:DeprecationWarning:pkg_resources
